name: 每日出片

on:
  # 定时暂停：质量小样通过用户确认之前不自动出片。恢复时去掉下面两行的 #
  # schedule:
  #   - cron: "30 0 * * *"   # 北京时间每天8:30（Cloudflare 免费额度在北京时间8点重置，必须排在它之后）
  workflow_dispatch:
    inputs:
      episode:
        description: "指定稿件（如 episodes/ep01.json），留空则取下一个选题"
        required: false
      images:
        description: "出图"
        default: ""
      tts:
        description: "配音"
        default: ""
      video:
        description: "动态（seedance：每个镜头都生成，720p 约 0.09 元/秒；留空用仓库变量）"
        default: ""

permissions:
  contents: write   # 把新生成的稿件提交回仓库，记录进度
  models: read      # 免费调用 GitHub Models 写稿

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          pip install -q requests pillow edge-tts boto3
      - name: 出片
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_PAYG_API_KEY: ${{ secrets.ARK_PAYG_API_KEY }}  # Seedance 视频按量付费用
          SEEDREAM_MODEL: ${{ vars.SEEDREAM_MODEL || 'doubao-seedream-5.0-pro' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://open.bigmodel.cn/api/paas/v4' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'glm-4.7' }}
          # 档位开关：仓库 Settings → Secrets and variables → Actions → Variables 里改，不用动代码
          IMAGE_PROVIDER: ${{ github.event.inputs.images || vars.IMAGE_PROVIDER || 'cloudflare' }}
          TTS_PROVIDER: ${{ github.event.inputs.tts || vars.TTS_PROVIDER || 'edge' }}
          VIDEO_PROVIDER: ${{ github.event.inputs.video || vars.VIDEO_PROVIDER || 'none' }}
        run: |
          if [ -n "${{ github.event.inputs.episode }}" ]; then
            python make_episode.py --episode "${{ github.event.inputs.episode }}"
          else
            python make_episode.py --next
          fi
      - name: 备份一份到 Actions 产物（保留30天，主存放在云盘）
        uses: actions/upload-artifact@v4
        with:
          name: yiwenbu-${{ github.run_number }}
          path: output/
          retention-days: 30
      - name: 提交新稿件和画面
        run: |
          git config user.name "yiwenbu-bot"
          git config user.email "yiwenbu-bot@users.noreply.github.com"
          git add episodes/ work/
          git diff --cached --quiet || (git commit -m "新增稿件和画面" && git push)
