name: 每日出片

on:
  schedule:
    - cron: "0 22 * * *"   # 北京时间每天早上6点
  workflow_dispatch:
    inputs:
      episode:
        description: "指定稿件（如 episodes/ep01.json），留空则取下一个选题"
        required: false

permissions:
  contents: write   # 把新生成的稿件提交回仓库，记录进度
  models: read      # 免费调用 GitHub Models 写稿

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          pip install -q requests pillow edge-tts boto3
      - name: 出片
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          if [ -n "${{ github.event.inputs.episode }}" ]; then
            python make_episode.py --episode "${{ github.event.inputs.episode }}"
          else
            python make_episode.py --next
          fi
      - name: 备份一份到 Actions 产物（保留30天，主存放在云盘）
        uses: actions/upload-artifact@v4
        with:
          name: yiwenbu-${{ github.run_number }}
          path: output/
          retention-days: 30
      - name: 提交新稿件和画面
        run: |
          git config user.name "yiwenbu-bot"
          git config user.email "yiwenbu-bot@users.noreply.github.com"
          git add episodes/ work/
          git diff --cached --quiet || (git commit -m "新增稿件和画面" && git push)
