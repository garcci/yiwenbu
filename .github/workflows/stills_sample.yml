name: 低成本静帧小样

on:
  push:
    branches: [claude/project-thread-l4wz3r]
    paths: ["video/stills_request.json", "video/stills_sample.py"]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-noto-cjk
          pip install -q requests pillow numpy opencv-python-headless
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers
      - env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python -u video/stills_sample.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stills
          path: work/stills/*.jpg
