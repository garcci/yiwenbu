name: Qinghe read-only diagnostic
on:
  push:
    branches: [claude/project-thread-l4wz3r]
    paths: ["video/qinghe_voice_audition/diagnose.py"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-requests
      - name: Check fixed status labels without generation
        env:
          AUDITION_PRIVATE_PACKAGE_ID: ${{ secrets.LEAD_AB_PRIVATE_PACKAGE_ID }}
          AUDITION_PRIVATE_PACKAGE_SHA256: ${{ secrets.LEAD_AB_PRIVATE_PACKAGE_SHA256 }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.AUDITION_DRIVE_FOLDER_ID }}
        run: python3 video/qinghe_voice_audition/diagnose.py
