name: 配音盲听

on:
  push:
    branches: [claude/project-thread-l4wz3r]
    paths: ["video/voice_test.py", "voice_test/**"]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg && pip install -q requests numpy
      - env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          git diff --name-only HEAD~1 | grep -q '^video/voice_test.py' || export SKIP_DOUBAO=1
          python -u video/voice_test.py
